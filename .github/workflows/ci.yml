name: ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: lint, types, tests, audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project and dev tooling
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: ruff (lint)
        run: ruff check --output-format=github .

      - name: ruff (format)
        run: ruff format --check .

      - name: mypy --strict
        run: mypy --strict

      - name: pytest --cov
        run: pytest --cov --cov-report=term-missing --cov-report=xml

      # The safety-critical packages carry a hard floor. Enforced as a separate
      # step so the number applies to app/domain and app/safety alone and
      # cannot be propped up by coverage elsewhere in the tree.
      - name: coverage gate (app/domain + app/safety >= 85%)
        run: coverage report --include="app/domain/*,app/safety/*" --fail-under=85

      # Project-path mode audits the pinned runtime dependency set that ships in
      # the image, and unlike an environment audit it does not trip --strict on
      # the local rxplain distribution (absent from PyPI by design).
      - name: pip-audit
        run: pip-audit --strict --progress-spinner=off .
