[project]
name = "rxplain"
version = "0.1.0"
description = "RxPlain - medication-literacy tool."
requires-python = "==3.12.*"
dependencies = [
    "anyio==4.14.2",
    "fastapi==0.141.1",
    "httpx2==2.12.0",
    "jinja2==3.1.6",
    "psycopg[binary,pool]==3.3.4",
    "pymongo==4.17.0",
    "slowapi==0.1.10",
    "pydantic==2.13.4",
    "pydantic-settings==2.15.0",
    "python-multipart==0.0.32",
    "rapidfuzz==3.14.5",
    "structlog==26.1.0",
    "uvicorn[standard]==0.52.4",
]

[project.optional-dependencies]
dev = [
    "hypothesis==6.165.10",
    "mutmut==3.7.0",
    "mypy==2.3.1",
    "pillow==12.3.0",
    "pip-audit==2.10.1",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.16.4",
    "textstat==0.7.13",
]

[build-system]
requires = ["hatchling==1.28.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# --------------------------------------------------------------------------- #
# ruff
# --------------------------------------------------------------------------- #
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["."]

[tool.ruff.lint]
select = [
    "A",      # builtin shadowing
    "ANN",    # missing annotations
    "ARG",    # unused arguments
    "ASYNC",  # async antipatterns
    "B",      # bugbear
    "BLE",    # blind except
    "C4",     # comprehensions
    "D",      # docstrings
    "DTZ",    # naive datetimes
    "E",      # pycodestyle errors
    "ERA",    # commented-out code
    "F",      # pyflakes
    "FBT",    # boolean traps
    "FIX",    # TODO / FIXME / XXX markers
    "G",      # logging format
    "I",      # import sorting
    "ICN",    # import conventions
    "ISC",    # implicit string concat
    "LOG",    # logging misuse
    "N",      # naming
    "PIE",    # misc lints
    "PL",     # pylint
    "PT",     # pytest style
    "PTH",    # pathlib
    "RET",    # return simplification
    "RUF",    # ruff-specific
    "S",      # bandit
    "SIM",    # simplify
    "TID",    # tidy imports
    "TRY",    # exception antipatterns
    "UP",     # pyupgrade
    "W",      # pycodestyle warnings
]
ignore = [
    "D203",   # conflicts with D211 (no blank line before class docstring)
    "D213",   # conflicts with D212 (summary on first line)
    "EM101",  # readability: short literals in raise are clearer inline
    "EM102",
    "TRY003", # readability: message text lives at the raise site
]

[tool.ruff.lint.per-file-ignores]
# Blocking file reads are correct and clearer in a test body.
"tests/**/*.py" = ["S101", "PLR2004", "ASYNC240", "PLR0913", "S105", "S106"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

# --------------------------------------------------------------------------- #
# mypy
# --------------------------------------------------------------------------- #
[tool.mypy]
python_version = "3.12"
files = ["app", "scripts", "tests"]
strict = true
disallow_any_explicit = true
warn_unreachable = true
extra_checks = true
enable_error_code = [
    "ignore-without-code",
    "possibly-undefined",
    "redundant-expr",
    "redundant-self",
    "truthy-bool",
    "truthy-iterable",
    "unused-awaitable",
]
plugins = ["pydantic.mypy"]

# textstat ships no type information; it is used only in tests.
[[tool.mypy.overrides]]
module = ["textstat.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
warn_untyped_fields = true

# --------------------------------------------------------------------------- #
# pytest
# --------------------------------------------------------------------------- #
[tool.pytest.ini_options]
minversion = "9.0"
addopts = "-q --strict-markers --strict-config"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["error"]

# --------------------------------------------------------------------------- #
# coverage
# --------------------------------------------------------------------------- #
[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

# --------------------------------------------------------------------------- #
# mutmut - mutation testing on the safety layer
# --------------------------------------------------------------------------- #
# Only app/safety is mutated. These two modules decide what a patient is shown,
# so a surviving mutant there is a missing test, not a style question.
[tool.mutmut]
# The whole package is copied into the sandbox so imports resolve, but only
# app/safety is mutated: these two modules decide what a patient is shown, so a
# surviving mutant there is a missing test rather than a style question.
source_paths = ["app"]
do_not_mutate = [
    "app/__init__.py",
    "app/config.py",
    "app/db.py",
    "app/main.py",
    "app/adapters/*",
    "app/domain/*",
    "app/web/*",
]
pytest_add_cli_args_test_selection = [
    "tests/unit/test_gates.py",
    "tests/unit/test_verifier.py",
]
