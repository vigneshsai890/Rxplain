# Local Postgres for development and integration tests.
# Start with:  docker compose up -d db
# The RxNorm approximate-match tier needs the pg_trgm extension, which ships
# with the official image and is enabled by migrations/001_extensions.sql.
services:
  db:
    image: postgres:17.6-bookworm
    environment:
      POSTGRES_DB: rxplain
      POSTGRES_USER: rxplain
      POSTGRES_PASSWORD: rxplain_local_dev
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rxplain -d rxplain"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - rxplain_pgdata:/var/lib/postgresql/data

volumes:
  rxplain_pgdata:
